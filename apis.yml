name: Forus Health
description: 'Forus Health Pvt Ltd is a Bengaluru, India based medical device manufacturer
  specializing in advanced eye-care and retinal-imaging technology. Its 3nethra family
  of devices covers adult and neonatal retinal imaging, refraction and myopia management,
  and anterior-segment imaging, complemented by the FH-POISE AI diagnostic platform
  that screens for diabetic retinopathy, glaucoma, cataract, hypertensive retinopathy,
  age-related macular degeneration, and dry eye. Forus also operates connected
  telemedicine platforms (FH TeleCare, FH TeleEye, FH TeleOpticals) for remote eye
  screening. The company reports more than 5,000 installations across 85+ countries.
  This profile was surfaced as a portfolio company of Accel and added to the API
  Evangelist network; no public developer API or documentation surface was found
  during enrichment.'
